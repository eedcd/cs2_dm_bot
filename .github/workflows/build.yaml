name: Build DM Bot (SDL2 + ImGui)

on:
  # 由 update-files.yml 触发，或手动触发
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build'
        required: false
        type: boolean
        default: true
      source_sha:
        description: 'Exact commit to build (used by the offset updater)'
        required: false
        type: string
        default: ''
  # 当 push 到 main 分支时也触发（用于代码 / 地图数据更新后的构建）
  push:
    branches: [ main ]
    paths:
      - 'external-cheat-base/**'
      - 'assets/maps/**'
      - 'tests/**'
      - 'LICENSE'
      - '.github/workflows/build.yaml'
      - '!external-cheat-base/generated/**'

permissions:
  contents: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.source_sha || github.sha }}
    - name: Build viewport regression tests
      run: |
        g++ -std=c++20 -O2 -Wall -Wextra -Werror \
          -Iexternal-cheat-base/src \
          tests/viewport_math_tests.cpp \
          -o viewport_math_tests
    - name: Run viewport regression tests
      run: ./viewport_math_tests
    - name: Build and run runtime timing tests
      run: |
        g++ -std=c++20 -O2 -Wall -Wextra -Werror \
          -Iexternal-cheat-base/src \
          tests/runtime_timing_tests.cpp \
          -o runtime_timing_tests
        ./runtime_timing_tests

  build:
    needs: [unit-tests]
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.source_sha || github.sha }}

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Build Solution
      shell: cmd
      run: |
        msbuild external-cheat-base.sln /p:Configuration=Release /p:Platform=x64

    - name: Verify release layout
      shell: pwsh
      run: |
        $required = @(
          "x64/Release/external-cheat-base.exe",
          "x64/Release/SDL2.dll",
          "x64/Release/maps/de_dust2.png",
          "x64/Release/maps/de_nuke.png",
          "x64/Release/maps/de_nuke_lower.png",
          "x64/Release/maps/de_vertigo_lower.png"
        )
        foreach ($path in $required) {
          if (-not (Test-Path $path)) {
            throw "Missing release artifact: $path"
          }
        }
        $mapCount = (Get-ChildItem "x64/Release/maps" -Filter *.png | Measure-Object).Count
        if ($mapCount -lt 20) {
          throw "Expected at least 20 map images, found $mapCount"
        }

    - name: Compress Release Artifacts
      run: |
        powershell Compress-Archive -Path x64/Release/* -DestinationPath x64/Release/Release-Binaries.zip

    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: Release-Binaries
        path: x64/Release/Release-Binaries.zip

    - name: Create Release
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $tag = "v2.0.${{ github.run_number }}.${{ github.run_attempt }}"
        gh release create $tag `
          "x64/Release/Release-Binaries.zip#Release-Binaries.zip" `
          --target "${{ inputs.source_sha || github.sha }}" `
          --title "Release $tag (DM Bot)" `
          --generate-notes
